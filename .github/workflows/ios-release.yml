name: iOS release (signed IPA)

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: 'iOS CFBundleVersion (integer). Leave blank to use pubspec.'
        required: false
        type: string
      upload_to_testflight:
        description: 'Upload the IPA to TestFlight after building.'
        required: false
        type: boolean
        default: true

env:
  IOS_BUNDLE_ID: com.usamarehman.mushaf
  IOS_PROFILE_NAME: Mushaf Quran
  IOS_SIGNING_IDENTITY: Apple Distribution

jobs:
  build-signed-ipa:
    name: Build signed IPA
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Xcode + SDK versions
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -E "iphoneos|iphonesimulator" || true

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.8'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Decode signing assets
        env:
          P12_BASE64: ${{ secrets.IOS_DIST_P12_BASE64 }}
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          mkdir -p $RUNNER_TEMP/signing
          echo "$P12_BASE64" | base64 --decode > $RUNNER_TEMP/signing/distribution.p12
          echo "$PROFILE_BASE64" | base64 --decode > $RUNNER_TEMP/signing/profile.mobileprovision

      - name: Create keychain and import certificate
        env:
          P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import $RUNNER_TEMP/signing/distribution.p12 \
            -P "$P12_PASSWORD" \
            -A -t cert -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$KEYCHAIN_PATH"

          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Install provisioning profile
        run: |
          PROFILE_UUID=$(grep -aA1 UUID $RUNNER_TEMP/signing/profile.mobileprovision | grep -io '[-A-F0-9]\{36\}' | head -n1)
          echo "PROFILE_UUID=$PROFILE_UUID" >> $GITHUB_ENV
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $RUNNER_TEMP/signing/profile.mobileprovision \
            ~/Library/MobileDevice/Provisioning\ Profiles/$PROFILE_UUID.mobileprovision
          echo "Installed profile UUID: $PROFILE_UUID"

      - name: Inject manual signing into Release.xcconfig
        run: |
          cat >> ios/Flutter/Release.xcconfig <<EOF

          // Injected by CI for signed release build
          DEVELOPMENT_TEAM=${{ secrets.IOS_TEAM_ID }}
          CODE_SIGN_STYLE=Manual
          PROVISIONING_PROFILE_SPECIFIER=$IOS_PROFILE_NAME
          CODE_SIGN_IDENTITY=$IOS_SIGNING_IDENTITY
          EOF
          tail -n 10 ios/Flutter/Release.xcconfig

      - name: Write ExportOptions.plist
        run: |
          cat > $RUNNER_TEMP/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store</string>
            <key>teamID</key><string>${{ secrets.IOS_TEAM_ID }}</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>$IOS_SIGNING_IDENTITY</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$IOS_BUNDLE_ID</key><string>$IOS_PROFILE_NAME</string>
            </dict>
            <key>stripSwiftSymbols</key><true/>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF
          cat $RUNNER_TEMP/ExportOptions.plist

      - name: Build IPA
        run: |
          BUILD_ARGS="--release --export-options-plist=$RUNNER_TEMP/ExportOptions.plist"
          if [ -n "${{ inputs.build_number }}" ]; then
            BUILD_ARGS="$BUILD_ARGS --build-number=${{ inputs.build_number }}"
          fi
          flutter build ipa $BUILD_ARGS

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: mushaf-ios-ipa
          path: build/ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload to TestFlight
        if: ${{ inputs.upload_to_testflight }}
        env:
          ASC_KEY_ID: ${{ secrets.IOS_ASC_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.IOS_ASC_API_ISSUER_ID }}
          ASC_KEY_BASE64: ${{ secrets.IOS_ASC_API_KEY_BASE64 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$ASC_KEY_BASE64" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8

          IPA_PATH=$(ls build/ios/ipa/*.ipa | head -n1)
          echo "Uploading $IPA_PATH"

          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"

      - name: Cleanup API key
        if: always()
        run: rm -f ~/.appstoreconnect/private_keys/AuthKey_*.p8 || true

      - name: Cleanup keychain
        if: always()
        run: |
          security delete-keychain $RUNNER_TEMP/build.keychain || true
